[project]
name = "llm-switch-mcp"
version = "1.0.0"
description = "一键换站 MCP：安全切换客户端站点，默认 dry-run + 自动备份"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
llm-switch-mcp = "llm_switch_mcp:main"

[project.urls]
Homepage = "https://github.com/dafeiai918/llm-switch-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["llm_switch_mcp.py"]
